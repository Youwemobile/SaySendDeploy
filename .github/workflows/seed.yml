name: 'Seed Stage Databases'

on:
  workflow_dispatch:

concurrency:
  group: deployment-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'stage/')
    steps:
    - name: Checkout infrastructure repo
      uses: actions/checkout@v4

    - name: Resolve namespace
      run: |
        IMAGE_TAG="$(echo '${{ github.ref_name }}' | sed 's/\//-/g')"
        echo "NAMESPACE=saysend-${IMAGE_TAG}" >> $GITHUB_ENV

    - name: Setup Kubernetes Environment
      uses: ./.github/actions/k8s-env-setup
      with:
        kubeconfig_base64: ${{ secrets.STAGE_KUBECONFIG_DATA }}

    - name: Seed Databases
      run: sh scripts/seed-stage.sh "${{ env.NAMESPACE }}"

    - name: Cleanup Kubeconfig
      if: always()
      uses: ./.github/actions/k8s-cleanup
