apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs
  template:
    metadata:
      labels:
        app: docs
    spec:
      containers:
        - name: swagger-ui
          image: {{ .Values.image | quote }}
          ports:
            - containerPort: 8080
          env:
            - name: BASE_URL
              value: "/docs"
            - name: URLS
              value: {{ .Values.urls | toJson | quote }}
          readinessProbe:
            httpGet:
              path: /docs/
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs/
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
