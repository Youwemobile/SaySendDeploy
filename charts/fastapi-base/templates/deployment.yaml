apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastapi-base.name" . }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ include "fastapi-base.name" . }}
  template:
    metadata:
      annotations:
        {{- if .Values.global }}
        deploy.date: {{ .Values.global.deployDate | quote }}
        {{- end }}
      labels:
        app: {{ include "fastapi-base.name" . }}
    spec:
      imagePullSecrets:
        - name: nexus-registry-key
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.service.targetPort | default 8000 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort | default 8000 }}
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort | default 8000 }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
          {{- if .Values.preStopSleepSeconds }}
          # Delays SIGTERM until the Ingress and kube-proxy stop routing to the
          # pod; they drop it only seconds after deletion starts, and uvicorn
          # closes its listener on SIGTERM right away.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.preStopSleepSeconds }}"]
          {{- end }}
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
