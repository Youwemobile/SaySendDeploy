postgres:
  volumeSize: 1Gi
  instances: 1
  resources:
    requests:
      cpu: 200m
      memory: 500Mi
    limits:
      cpu: 1000m
      memory: 2000Mi

docs:
  ingress:
    annotations:
      kubernetes.io/ingress.class: "haproxy"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    host: "" # set by the source repo's CI
    tls:
      secretName: saysend-tls
